services:
    frontend:
        image: node:24
        user: node
        working_dir: /app
        command: sh -c "corepack pnpm install --frozen-lockfile && corepack pnpm dev --host 0.0.0.0"
        environment:
            NUXT_API_BASE: '${NUXT_API_BASE:-http://laravel.test/api}'
            NUXT_API_TOKEN: '${NUXT_API_TOKEN:-local-token-standard}'
        volumes:
            - '.:/app'
        ports:
            - '${FRONTEND_PORT:-3000}:3000'
        networks:
            - sail
networks:
    sail:
        driver: bridge
